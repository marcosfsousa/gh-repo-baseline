[pytest]
# Declares where the suite lives, so a bare `pytest` from the repo root collects
# the same set as `pytest tests/` by declaration rather than by accident of the
# tree layout. It names a directory, not a file list, so a new test file needs no
# registration anywhere and this cannot go stale.
testpaths = tests

# templates/ holds files meant to be copied into other repos, not run here.
# templates/tests/test_required_checks.py resolves .github paths relative to its
# own grandparent, which is only a repo root once it has been copied out — so
# collecting it here would fail on paths that were never supposed to exist.
#
# tests/test_required_checks.py is the copy that IS collected: the same guard,
# pointed at this repo's own workflow and ruleset. tests/test_guard.py holds the
# two files identical below their headers.
#
# Excluded by directory rather than by renaming the template to `.template`, so it
# keeps its extension and stays lintable, navigable, and diffable as Python.
norecursedirs = templates .git
