[pytest]
# templates/ holds files meant to be copied into other repos, not run here.
# templates/tests/test_required_checks.py resolves .github paths relative to its
# own grandparent, which is only the repo root once it has been copied out — so a
# bare `pytest` at this root would collect it and fail on paths that were never
# supposed to exist here.
#
# Excluded by directory rather than by renaming the file to `.template`, so it
# keeps its extension and stays lintable, navigable, and diffable as Python.
norecursedirs = templates .git
